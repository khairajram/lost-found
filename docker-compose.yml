version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: findlost-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: findlost
      POSTGRES_PASSWORD: findlost_password
      POSTGRES_DB: findlost
    volumes:
      - findlost_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findlost -d findlost"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  findlost_postgres_data:
    driver: local
